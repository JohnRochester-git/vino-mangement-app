# Terraform for the Cloudflare platform (infra/).
# - On a pull request that touches infra/: check formatting, validate, and plan.
#   The plan is shown in the run's summary for review.
# - After merging to main: plan again. Nothing is applied automatically.
# - To apply: read the plan, then start this workflow by hand on main
#   (Actions > Terraform > Run workflow). Starting it is the approval.
#
# Needs these repository secrets:
#   CF_TERRAFORM_TOKEN          Cloudflare token with Workers R2 Storage Edit
#                               and D1 Edit (add DNS/zone permissions later)
#   TF_STATE_ACCESS_KEY_ID      R2 key for the vino-terraform-state bucket
#   TF_STATE_SECRET_ACCESS_KEY  R2 secret for that key
#   CLOUDFLARE_ACCOUNT_ID       the Cloudflare account ID

name: Terraform

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  contents: read

# The state has no lock, so never run two Terraform jobs at once.
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Terraform reads these on its own: the R2 keys for the state backend,
  # the Cloudflare token for the provider, and var.account_id.
  AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TERRAFORM_TOKEN }}
  TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

defaults:
  run:
    working-directory: infra

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8 # same as on the laptop
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init

      - name: Validate
        run: terraform validate

      # -detailed-exitcode: 0 = no changes, 2 = changes, 1 = error.
      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
          CODE=$?
          set -e
          cat plan.txt
          {
            echo "## Terraform plan"
            echo '```'
            # The account ID appears in some resources; keep it out of the summary.
            sed "s/${TF_VAR_account_id}/<account-id>/g" plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" -eq 1 ]; then exit 1; fi
          echo "changes=$([ "$CODE" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
    outputs:
      changes: ${{ steps.plan.outputs.changes }}

  apply:
    needs: plan
    # Only when started by hand on main, and only when the plan found changes.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Init
        run: terraform init

      # Plans again on this machine and applies exactly that plan.
      - name: Apply
        run: |
          terraform plan -no-color -out=tfplan
          terraform apply -no-color tfplan
