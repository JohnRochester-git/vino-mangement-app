services:
  backend:
    build: ./backend
    image: vino-backend
    ports:
      - "8000:8000"
    env_file:
      - path: backend/.env
        required: false
    environment:
      DB_BACKEND: sqlite
      SQLITE_PATH: /data/vino.db
      AUTO_MIGRATE: "true"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500}
    volumes:
      - vino-data:/data
    healthcheck:
      interval: 5s
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    restart: unless-stopped

volumes:
  vino-data:
