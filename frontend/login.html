<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vino — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/login.css">
</head>

<body class="login-page">

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- Background watermark grape ornament -->
  <div class="bg-ornament">
    <svg width="420" height="420" viewBox="0 0 24 24" fill="none" stroke="#C9A15B" stroke-width="1.2">
      <path d="M22 5V2l-5.89 5.89" />
      <circle cx="16.6" cy="15.89" r="3" />
      <circle cx="8.11" cy="7.4" r="3" />
      <circle cx="12.35" cy="11.65" r="3" />
      <circle cx="13.91" cy="5.85" r="3" />
      <circle cx="18.15" cy="10.09" r="3" />
      <circle cx="6.56" cy="13.2" r="3" />
      <circle cx="10.8" cy="17.44" r="3" />
      <circle cx="5" cy="19" r="3" />
    </svg>
  </div>

  <div class="login-container">
    <!-- Front and center Vino Logo & Branding -->
    <div class="brand-center">
      <div class="logo-badge" id="logoBadge" title="Vino — Personal Wine Cellar">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#C9A15B" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 5V2l-5.89 5.89" />
          <circle cx="16.6" cy="15.89" r="3" />
          <circle cx="8.11" cy="7.4" r="3" />
          <circle cx="12.35" cy="11.65" r="3" />
          <circle cx="13.91" cy="5.85" r="3" />
          <circle cx="18.15" cy="10.09" r="3" />
          <circle cx="6.56" cy="13.2" r="3" />
          <circle cx="10.8" cy="17.44" r="3" />
          <circle cx="5" cy="19" r="3" />
        </svg>
      </div>
      <h1 class="brand-title">Vino</h1>
      <div class="brand-subtitle">PERSONAL WINE CELLAR</div>
      <div class="brand-tagline">Access your private collection & tasting notes</div>
    </div>

    <!-- Sign In Form Card -->
    <div class="auth-card">
      <div class="card-header-label">Sign in to your cellar</div>

      <div id="alertBanner" class="alert-banner">
        <svg id="alertIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <span id="alertText">Invalid credentials</span>
      </div>

      <form id="loginForm" autocomplete="on">
        <!-- Name fields (sign-up only) -->
        <div class="name-row" id="nameRow">
          <div class="form-group" style="margin-bottom:0">
            <label class="form-label" for="firstNameInput">FIRST NAME</label>
            <input type="text" id="firstNameInput" class="form-input" placeholder="First name">
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label class="form-label" for="lastNameInput">LAST NAME</label>
            <input type="text" id="lastNameInput" class="form-input" placeholder="Last name">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="usernameInput" id="usernameLabel">USERNAME OR EMAIL</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </span>
            <input type="text" id="usernameInput" class="form-input" placeholder="Your username" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="passwordInput" id="passwordLabel">PASSWORD</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0110 0v4" />
              </svg>
            </span>
            <input type="password" id="passwordInput" class="form-input" placeholder="••••••••••••"
              style="padding-right: 42px;" required>
            <button type="button" class="toggle-pwd" id="togglePwdBtn" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-actions-row">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember me</span>
          </label>
          <a href="#forgot" class="forgot-link" id="forgotLink">Forgot password?</a>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="spinner" id="btnSpinner"></span>
          <span id="btnText">Sign In to Cellar</span>
          <svg id="arrowIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </button>

        <div class="auth-toggle" id="authToggle">
          Don't have an account? <a href="#" id="toggleAuthMode">Create one</a>
        </div>
      </form>
    </div>

    <div class="login-footer">
      Vino Cellar Management System &bull; Vintage Reserve Edition
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>

</html>
