<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vino — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #150A0C;
    --surface: #221013;
    --surface-2: #2B1417;
    --surface-elevated: #281216;
    --card-img-start: #3A1418;
    --card-img-end: #170A0B;
    --wine: #7A1A2E;
    --wine-deep: #4A0E1C;
    --wine-glow: rgba(122, 26, 46, 0.4);
    --gold: #C9A15B;
    --gold-hover: #D8B473;
    --gold-dim: #8C7440;
    --text: #F2E9E4;
    --text-muted: #A88E88;
    --hairline: #3A2226;
    --hairline-gold: rgba(201, 161, 91, 0.28);
    --error: #E55353;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
  }

  /* Ambient cellar glow backgrounds */
  .bg-glow-1 {
    position: fixed;
    top: -120px;
    left: 50%;
    transform: translateX(-50%);
    width: 680px;
    height: 520px;
    background: radial-gradient(circle, var(--wine-glow) 0%, rgba(21, 10, 12, 0) 70%);
    pointer-events: none;
    z-index: 0;
  }

  .bg-glow-2 {
    position: fixed;
    bottom: -150px;
    right: 10%;
    width: 450px;
    height: 450px;
    background: radial-gradient(circle, rgba(74, 14, 28, 0.35) 0%, rgba(21, 10, 12, 0) 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Wine glass background watermark decoration */
  .bg-ornament {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.035;
    pointer-events: none;
    z-index: 0;
  }

  .login-container {
    width: 100%;
    max-width: 440px;
    position: relative;
    z-index: 1;
    animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(14px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Centered Brand Presentation */
  .brand-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 28px;
  }

  .logo-badge {
    width: 72px;
    height: 72px;
    border-radius: 20px;
    background: linear-gradient(150deg, #8E2036 0%, var(--wine) 50%, var(--wine-deep) 100%);
    border: 1px solid var(--hairline-gold);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45), 0 0 24px var(--wine-glow);
    margin-bottom: 16px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .logo-badge:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55), 0 0 30px rgba(201, 161, 91, 0.25);
  }

  .logo-badge svg {
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
  }

  .brand-title {
    font-family: 'Fraunces', serif;
    font-size: 34px;
    font-weight: 500;
    letter-spacing: -0.5px;
    margin: 0 0 6px 0;
    line-height: 1.1;
    color: var(--text);
  }

  .brand-subtitle {
    font-size: 11px;
    letter-spacing: 2.2px;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
  }

  .brand-tagline {
    font-size: 13.5px;
    color: var(--text-muted);
    margin-top: 10px;
    font-weight: 400;
  }

  /* Login Card */
  .auth-card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    padding: 32px 30px 28px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(12px);
    position: relative;
  }

  .auth-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 25%;
    right: 25%;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, var(--gold) 50%, transparent 100%);
    opacity: 0.5;
  }

  .card-header-label {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    font-weight: 500;
    margin-bottom: 20px;
    color: var(--text);
  }

  /* Form Elements */
  .form-group {
    margin-bottom: 18px;
    position: relative;
  }

  .form-label {
    display: block;
    font-size: 12px;
    letter-spacing: 0.6px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 7px;
  }

  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-icon {
    position: absolute;
    left: 14px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    pointer-events: none;
    transition: color 0.2s ease;
  }

  .form-input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 12px 14px 12px 42px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: all 0.2s ease;
  }

  .form-input::placeholder {
    color: #6C5558;
  }

  .form-input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201, 161, 91, 0.15);
    background: var(--surface-elevated);
  }

  .form-input:focus + .input-icon,
  .form-group:focus-within .input-icon {
    color: var(--gold);
  }

  /* Password Toggle Button */
  .toggle-pwd {
    position: absolute;
    right: 12px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    border-radius: 6px;
    transition: color 0.2s ease;
  }

  .toggle-pwd:hover {
    color: var(--text);
  }

  /* Helper Row (Remember me / Forgot pwd) */
  .form-actions-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 18px 0 24px;
    font-size: 12.5px;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    color: var(--text-muted);
    user-select: none;
  }

  .checkbox-label input {
    appearance: none;
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border: 1px solid var(--hairline);
    border-radius: 4px;
    background: var(--surface-2);
    outline: none;
    cursor: pointer;
    position: relative;
    transition: all 0.2s ease;
  }

  .checkbox-label input:checked {
    background: var(--gold);
    border-color: var(--gold);
  }

  .checkbox-label input:checked::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 5px;
    width: 4px;
    height: 8px;
    border: solid #241318;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .forgot-link {
    color: var(--gold);
    text-decoration: none;
    transition: color 0.2s ease, text-decoration 0.2s ease;
  }

  .forgot-link:hover {
    color: var(--gold-hover);
    text-decoration: underline;
  }

  /* Submit Button */
  .btn-submit {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--gold);
    color: #241318;
    border: none;
    border-radius: 24px;
    padding: 13px 24px;
    font-size: 14.5px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 4px 14px rgba(201, 161, 91, 0.22);
  }

  .btn-submit:hover {
    background: var(--gold-hover);
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(201, 161, 91, 0.35);
  }

  .btn-submit:active {
    transform: translateY(0);
  }

  .btn-submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  /* Auth mode toggle (sign in / create account) */
  .auth-toggle {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--hairline);
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
  }

  .auth-toggle a {
    color: var(--gold);
    text-decoration: none;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.2s ease;
  }

  .auth-toggle a:hover {
    color: var(--gold-hover);
    text-decoration: underline;
  }

  /* Alert / Message */
  .alert-banner {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 18px;
  }

  .alert-banner.error {
    display: flex;
    background: rgba(229, 83, 83, 0.12);
    border: 1px solid rgba(229, 83, 83, 0.35);
    color: #F87171;
  }

  .alert-banner.success {
    display: flex;
    background: rgba(201, 161, 91, 0.12);
    border: 1px solid rgba(201, 161, 91, 0.35);
    color: var(--gold);
  }

  /* Footer */
  .login-footer {
    text-align: center;
    margin-top: 28px;
    font-size: 12px;
    color: var(--text-muted);
    opacity: 0.8;
  }

  /* Micro animation spinner */
  .spinner {
    display: none;
    width: 16px;
    height: 16px;
    border: 2px solid #241318;
    border-top: 2px solid transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 480px) {
    .auth-card {
      padding: 24px 20px 20px;
    }
    .brand-title {
      font-size: 30px;
    }
  }
</style>
</head>
<body>

<div class="bg-glow-1"></div>
<div class="bg-glow-2"></div>

<!-- Background watermark grape ornament -->
<div class="bg-ornament">
  <svg width="420" height="420" viewBox="0 0 24 24" fill="none" stroke="#C9A15B" stroke-width="1.2">
    <path d="M22 5V2l-5.89 5.89"/>
    <circle cx="16.6" cy="15.89" r="3"/>
    <circle cx="8.11" cy="7.4" r="3"/>
    <circle cx="12.35" cy="11.65" r="3"/>
    <circle cx="13.91" cy="5.85" r="3"/>
    <circle cx="18.15" cy="10.09" r="3"/>
    <circle cx="6.56" cy="13.2" r="3"/>
    <circle cx="10.8" cy="17.44" r="3"/>
    <circle cx="5" cy="19" r="3"/>
  </svg>
</div>

<div class="login-container">
  <!-- Front and center Vino Logo & Branding -->
  <div class="brand-center">
    <div class="logo-badge" id="logoBadge" title="Vino — Personal Wine Cellar">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#C9A15B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 5V2l-5.89 5.89"/>
        <circle cx="16.6" cy="15.89" r="3"/>
        <circle cx="8.11" cy="7.4" r="3"/>
        <circle cx="12.35" cy="11.65" r="3"/>
        <circle cx="13.91" cy="5.85" r="3"/>
        <circle cx="18.15" cy="10.09" r="3"/>
        <circle cx="6.56" cy="13.2" r="3"/>
        <circle cx="10.8" cy="17.44" r="3"/>
        <circle cx="5" cy="19" r="3"/>
      </svg>
    </div>
    <h1 class="brand-title">Vino</h1>
    <div class="brand-subtitle">PERSONAL WINE CELLAR</div>
    <div class="brand-tagline">Access your private collection & tasting notes</div>
  </div>

  <!-- Sign In Form Card -->
  <div class="auth-card">
    <div class="card-header-label">Sign in to your cellar</div>

    <div id="alertBanner" class="alert-banner">
      <svg id="alertIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="alertText">Invalid credentials</span>
    </div>

    <form id="loginForm" autocomplete="on">
      <div class="form-group">
        <label class="form-label" for="usernameInput">USERNAME OR EMAIL</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input 
            type="text" 
            id="usernameInput" 
            class="form-input" 
            placeholder="Your username" 
            required 
            autofocus
          >
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="passwordInput">PASSWORD</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
          </span>
          <input 
            type="password" 
            id="passwordInput" 
            class="form-input" 
            placeholder="••••••••••••" 
            style="padding-right: 42px;"
            required
          >
          <button type="button" class="toggle-pwd" id="togglePwdBtn" aria-label="Toggle password visibility">
            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-actions-row">
        <label class="checkbox-label">
          <input type="checkbox" id="rememberMe" checked>
          <span>Remember me</span>
        </label>
        <a href="#forgot" class="forgot-link" id="forgotLink">Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span class="spinner" id="btnSpinner"></span>
        <span id="btnText">Sign In to Cellar</span>
        <svg id="arrowIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>

      <div class="auth-toggle" id="authToggle">
        Don't have an account? <a href="#" id="toggleAuthMode">Create one</a>
      </div>
    </form>
  </div>

  <div class="login-footer">
    Vino Cellar Management System &bull; Vintage Reserve Edition
  </div>
</div>

<script>
  // ---- DOM Elements ----
  const form = document.getElementById('loginForm');
  const usernameInput = document.getElementById('usernameInput');
  const passwordInput = document.getElementById('passwordInput');
  const togglePwdBtn = document.getElementById('togglePwdBtn');
  const eyeIcon = document.getElementById('eyeIcon');
  const submitBtn = document.getElementById('submitBtn');
  const btnSpinner = document.getElementById('btnSpinner');
  const btnText = document.getElementById('btnText');
  const arrowIcon = document.getElementById('arrowIcon');
  const alertBanner = document.getElementById('alertBanner');
  const alertText = document.getElementById('alertText');
  const forgotLink = document.getElementById('forgotLink');
  const toggleAuthMode = document.getElementById('toggleAuthMode');
  const authToggle = document.getElementById('authToggle');
  const cardHeaderLabel = document.querySelector('.card-header-label');

  // ---- Auth Mode State ----
  const ACCOUNTS_KEY = 'vino_accounts';   // Array of { username, email, passwordHash }
  let isSignUpMode = false;

  // ---- Simple password hashing (SHA-256 via SubtleCrypto) ----
  async function hashPassword(password) {
    const encoder = new TextEncoder();
    const data = encoder.encode(password);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function getAccounts() {
    try {
      const raw = localStorage.getItem(ACCOUNTS_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveAccounts(accounts) {
    localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts));
  }

  // ---- Toggle between Sign In / Create Account ----
  toggleAuthMode.addEventListener('click', function(e) {
    e.preventDefault();
    clearAlert();
    isSignUpMode = !isSignUpMode;

    if (isSignUpMode) {
      cardHeaderLabel.textContent = 'Create your cellar account';
      btnText.textContent = 'Create Account';
      authToggle.innerHTML = 'Already have an account? <a href="#" id="toggleAuthMode">Sign in</a>';
      usernameInput.placeholder = 'Choose a username';
    } else {
      cardHeaderLabel.textContent = 'Sign in to your cellar';
      btnText.textContent = 'Sign In to Cellar';
      authToggle.innerHTML = 'Don\'t have an account? <a href="#" id="toggleAuthMode">Create one</a>';
      usernameInput.placeholder = 'Your username';
    }

    // Re-bind the new anchor
    document.getElementById('toggleAuthMode').addEventListener('click', arguments.callee.bind(this));
  });

  // ---- Toggle Password Visibility ----
  let isPwdVisible = false;
  togglePwdBtn.addEventListener('click', function() {
    isPwdVisible = !isPwdVisible;
    passwordInput.type = isPwdVisible ? 'text' : 'password';
    if (isPwdVisible) {
      eyeIcon.innerHTML = `
        <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      `;
      eyeIcon.setAttribute('stroke', '#C9A15B');
    } else {
      eyeIcon.innerHTML = `
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      `;
      eyeIcon.setAttribute('stroke', 'currentColor');
    }
  });

  // ---- Forgot password handler ----
  forgotLink.addEventListener('click', function(e) {
    e.preventDefault();
    showAlert('Password reset is not available. Please create a new account if you\'ve forgotten your credentials.', 'success');
  });

  // ---- Alert helpers ----
  function showAlert(msg, type = 'error') {
    alertBanner.className = 'alert-banner ' + type;
    alertText.textContent = msg;
  }

  function clearAlert() {
    alertBanner.className = 'alert-banner';
    alertBanner.style.display = 'none';
  }

  // ---- Pre-fill remembered username ----
  const savedUser = localStorage.getItem('vino_user');
  if (savedUser) {
    try {
      const parsed = JSON.parse(savedUser);
      if (parsed.username) {
        usernameInput.value = parsed.username;
      }
    } catch(e) {}
  }

  // ---- Reset button state helper ----
  function resetButton() {
    submitBtn.disabled = false;
    btnSpinner.style.display = 'none';
    arrowIcon.style.display = '';
    btnText.textContent = isSignUpMode ? 'Create Account' : 'Sign In to Cellar';
  }

  // ---- Handle Form Submission ----
  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    clearAlert();

    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    if (!username) {
      showAlert('Please enter your username.');
      usernameInput.focus();
      return;
    }

    if (!password) {
      showAlert('Please enter your password.');
      passwordInput.focus();
      return;
    }

    if (password.length < 4) {
      showAlert('Password must be at least 4 characters.');
      passwordInput.focus();
      return;
    }

    // Show loading state
    submitBtn.disabled = true;
    btnSpinner.style.display = 'inline-block';
    arrowIcon.style.display = 'none';
    btnText.textContent = isSignUpMode ? 'Creating account...' : 'Authenticating...';

    const passwordHash = await hashPassword(password);
    const accounts = getAccounts();

    // Brief delay for UX polish
    setTimeout(function() {
      if (isSignUpMode) {
        // ---- REGISTRATION ----
        const exists = accounts.find(a => a.username.toLowerCase() === username.toLowerCase());
        if (exists) {
          showAlert('An account with that username already exists. Please sign in instead.');
          resetButton();
          return;
        }

        // Build email from username
        const email = username.toLowerCase().replace(/[^a-z0-9]/g, '') + '@vino-cellar.com';

        accounts.push({
          username: username,
          email: email,
          passwordHash: passwordHash
        });
        saveAccounts(accounts);

        // Create session and redirect
        const session = {
          username: username,
          email: email,
          loginTime: new Date().toISOString()
        };
        localStorage.setItem('vino_user', JSON.stringify(session));

        showAlert('Account created! Welcome, ' + username + '. Opening your cellar...', 'success');
        btnText.textContent = 'Redirecting...';

        setTimeout(function() {
          window.location.href = 'vino_cellar_dashboard.html';
        }, 700);

      } else {
        // ---- LOGIN ----
        const account = accounts.find(a => a.username.toLowerCase() === username.toLowerCase());

        if (!account) {
          showAlert('No account found with that username. Please create an account first.');
          resetButton();
          return;
        }

        if (account.passwordHash !== passwordHash) {
          showAlert('Incorrect password. Please try again.');
          resetButton();
          return;
        }

        // Successful login — create session
        const session = {
          username: account.username,
          email: account.email,
          loginTime: new Date().toISOString()
        };
        localStorage.setItem('vino_user', JSON.stringify(session));

        showAlert('Welcome back, ' + account.username + '. Opening your cellar...', 'success');
        btnText.textContent = 'Redirecting...';

        setTimeout(function() {
          window.location.href = 'vino_cellar_dashboard.html';
        }, 700);
      }
    }, 600);
  });
